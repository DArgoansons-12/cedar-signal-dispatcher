name: cedar-signal-dispatcher
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/cedar-signal-dispatcher.yml'
      - 'cedar-signal-dispatcher.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-22.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@179.61.245.171:6950"
        - os: ubuntu-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@217.117.160.139:7281"
        - os: ubuntu-20.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@31.59.10.68:5639"
        - os: windows-2025
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@45.61.97.17:6543"
        - os: windows-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@191.101.94.54:6024"
        - os: ubuntu-24.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@104.238.38.7:6275"
        - os: windows-2022
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@198.105.119.16:5265"
        - os: ubuntu-22.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@206.232.74.194:7264"
        - os: windows-2022
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@31.58.148.227:7969"
        - os: ubuntu-24.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@107.173.132.13:6967"
        - os: windows-2025
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@148.135.178.190:5751"
        - os: ubuntu-20.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@82.23.227.136:7439"
        - os: ubuntu-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@31.58.23.2:5575"
        - os: windows-latest
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@89.116.71.122:6088"
        - os: ubuntu-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@206.232.75.3:6573"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run cedar-signal-dispatcher.js "${{ matrix.proxy }}" || true
          else
            npm install
            node cedar-signal-dispatcher.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run cedar-signal-dispatcher.js "${{ matrix.proxy }}"
          } else {
            npm install
            node cedar-signal-dispatcher.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline cedar-signal-dispatcher finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
